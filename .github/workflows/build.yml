name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Fix android folder:
        run:
          mv lib/main.dart /tmp/m.dart
          flutter create. --platforms=android --project-name=darell_trading_plan
          mv /tmp/m.dart lib/main
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: darell-apk
          path: build/app/outputs/flutter-apk/app-release.apk
